name: Security

on:
  push:
    branches: ["main", "feature", "secondary"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  govulncheck:
    name: Go dependency CVE scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build packages
        run: go build ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Go static security analysis (gosec)
    runs-on: ubuntu-latest
    steps:  
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.24.3"

          artifact="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"

          curl -sSfL "${base_url}/${artifact}" -o "${artifact}"
          curl -sSfL "${base_url}/gitleaks_${version}_checksums.txt" -o checksums.txt

          expected_sha="$(grep "  ${artifact}$" checksums.txt | awk '{print $1}')"
          if [[ -z "${expected_sha}" ]]; then
            echo "Failed to locate checksum for ${artifact}" >&2
            exit 1
          fi

          echo "${expected_sha}  ${artifact}" | sha256sum -c -
          tar -xzf "${artifact}"
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build container image
        run: docker build -t ishosbackend:ci .

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:0.56.1 image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            ishosbackend:ci
