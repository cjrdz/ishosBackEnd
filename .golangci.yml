version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
  settings:
    misspell:
      # User-facing messages are in Spanish; these are correct Spanish words.
      ignore-rules:
        - inventario
        - producto
        - productos
        - momento
  exclusions:
    # Test fixtures intentionally use dummy credentials and temp file paths.
    rules:
      - path: '.*_test\.go$'
        linters:
          - gosec
        text: '(?i)G101|G304'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cjrdz/ishosBackEnd
