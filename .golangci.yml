run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gocritic

linters-settings:
  goimports:
    local-prefixes: github.com/cjrdz/ishosFactory-backend

issues:
  exclude-rules:
    - path: ent/
      linters:
        - all
