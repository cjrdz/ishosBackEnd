      tags:
        - Auth
  /auth/logout:
    post:
      description: Revokes the current session and clears the auth cookie.
      operationId: logout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Logout
      tags:
        - Auth
  /auth/session:
    get:
      description: Returns the currently authenticated employee session.
      operationId: get-session
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
