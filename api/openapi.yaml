          format: int64
          type: integer
        id:
          description: Category ID
          format: uuid
          type: string
        image_path:
          description: Image object path
          type: string
        is_active:
          description: Whether the category is active
          example: true
          type: boolean
        name:
          description: Category name
          example: Gelatos
          type: string
        slug:
          description: URL slug
          example: gelatos
          type: string
      required:
        - id
        - name
        - slug
        - description
        - display_order
        - is_active
        - created_at
