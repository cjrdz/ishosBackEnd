info:
  title: ishos API
  version: 1.0.0
openapi: 3.0.3
paths:
  /addons:
    get:
      description: Returns a list of active addons.
      operationId: list-addons
      parameters:
        - description: Return all addons
          explode: false
          in: query
          name: all
          schema:
            default: false
            description: Return all addons
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponseAddon"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List addons
      tags:
        - Public catalog
    post:
      description: Creates a new addon. Admin only.
      operationId: create-addon
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create addon
      tags:
        - Addons
  /addons/{id}:
    delete:
      description: Removes an addon. Admin only.
      operationId: delete-addon
      parameters:
        - description: Addon ID
          in: path
          name: id
          required: true
          schema:
            description: Addon ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete addon
      tags:
        - Addons
    get:
      description: Returns a single addon by ID.
      operationId: get-addon
      parameters:
        - description: Addon ID
          in: path
          name: id
          required: true
          schema:
            description: Addon ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get addon
      tags:
        - Public catalog
    patch:
      description: Updates an existing addon. Admin only.
      operationId: update-addon
      parameters:
        - description: Addon ID
          in: path
          name: id
          required: true
          schema:
            description: Addon ID
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update addon
      tags:
        - Addons
  /admin/orders/archive/run:
    post:
      description: Triggers an immediate auto-archive pass. Admin only.
      operationId: run-order-archive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run order archive
      tags:
        - Orders
  /analytics/dashboard:
    get:
      description: Returns overview, orders-over-time, and top-products in a single response.
      operationId: analytics-dashboard
      parameters:
        - description: Start date (YYYY-MM-DD)
          explode: false
          in: query
          name: start
          schema:
            description: Start date (YYYY-MM-DD)
            example: "2026-06-01"
            type: string
        - description: End date (YYYY-MM-DD)
          explode: false
          in: query
          name: end
          schema:
            description: End date (YYYY-MM-DD)
            example: "2026-07-01"
            type: string
        - description: Bucket granularity
          explode: false
          in: query
          name: groupBy
          schema:
            default: day
            description: Bucket granularity
            enum:
              - day
              - week
              - month
            type: string
        - description: Number of products to return
          explode: false
          in: query
          name: limit
          schema:
            default: 10
            description: Number of products to return
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDashboardOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Analytics dashboard
      tags:
        - Analytics
  /analytics/orders-over-time:
    get:
      description: Returns order counts and revenue over a date range.
      operationId: analytics-orders-over-time
      parameters:
        - description: Start date (YYYY-MM-DD)
          explode: false
          in: query
          name: start
          schema:
            description: Start date (YYYY-MM-DD)
            example: "2026-06-01"
            type: string
        - description: End date (YYYY-MM-DD)
          explode: false
          in: query
          name: end
          schema:
            description: End date (YYYY-MM-DD)
            example: "2026-07-01"
            type: string
        - description: Bucket granularity
          explode: false
          in: query
          name: groupBy
          schema:
            default: day
            description: Bucket granularity
            enum:
              - day
              - week
              - month
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AnalyticsTimelinePoint"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Orders over time
      tags:
        - Analytics
  /analytics/overview:
    get:
      description: Returns aggregate order metrics for a period.
      operationId: analytics-overview
      parameters:
        - description: Report period
          explode: false
          in: query
          name: period
          schema:
            default: month
            description: Report period
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Analytics overview
      tags:
        - Analytics
  /analytics/top-products:
    get:
      description: Returns the best-selling products for a date range.
      operationId: analytics-top-products
      parameters:
        - description: Start date (YYYY-MM-DD)
          explode: false
          in: query
          name: start
          schema:
            description: Start date (YYYY-MM-DD)
            example: "2026-06-01"
            type: string
        - description: End date (YYYY-MM-DD)
          explode: false
          in: query
          name: end
          schema:
            description: End date (YYYY-MM-DD)
            example: "2026-07-01"
            type: string
        - description: Number of products to return
          explode: false
          in: query
          name: limit
          schema:
            default: 10
            description: Number of products to return
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AnalyticsTopProduct"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Top products
      tags:
        - Analytics
  /auth/lockout/reset:
    post:
      description: Resets the login rate-limit/lockout state for an email.
      operationId: reset-login-lockout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reset-login-lockoutRequest"
        required: true
      responses:
