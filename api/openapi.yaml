            type: integer
        - description: Items per page
          explode: false
          in: query
          name: per_page
          schema:
            default: 20
            description: Items per page
            format: int64
            type: integer
        - description: Return all categories (admin fallback)
          explode: false
          in: query
          name: all
          schema:
            default: false
