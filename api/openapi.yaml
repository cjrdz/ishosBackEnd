components:
  schemas:
    ActiveOffer:
      additionalProperties: false
      properties:
        discount_price:
          description: Discount price
          format: double
          type: number
        expires_at:
          description: Offer expiration (RFC 3339)
          type: string
        flavor_id:
          description: Flavor ID
          type: string
        flavor_ids:
          description: Flavor IDs
          items:
            type: string
          nullable: true
          type: array
        label:
          description: Offer label
          type: string
        note:
          description: Offer note
          type: string
        product_id:
          description: Product ID
          type: string
      required:
        - product_id
        - label
        - expires_at
      type: object
    Addon:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/Addon.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: Creation timestamp
          format: date-time
          type: string
        display_order:
          description: Display order
          example: 1
          format: int64
          type: integer
        group_name:
          description: Addon group name
          example: Extras
          type: string
        id:
          description: Addon ID
          format: uuid
          type: string
        is_active:
          description: Whether the addon is active
          example: true
          type: boolean
        name:
          description: Addon name
          example: Extra scoop
          type: string
        price:
          description: Addon price
          example: 1
          format: double
          type: number
      required:
        - id
        - name
        - price
        - group_name
        - display_order
        - is_active
        - created_at
      type: object
    AnalyticsDashboardOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/AnalyticsDashboardOutputBody.json
          format: uri
          readOnly: true
          type: string
        orders_over_time:
          description: Order counts and revenue over the date range
          items:
            $ref: "#/components/schemas/AnalyticsTimelinePoint"
          nullable: true
          type: array
        overview:
          $ref: "#/components/schemas/AnalyticsOverview"
          description: Aggregate metrics for the date range
        top_products:
          description: Best-selling products for the date range
          items:
            $ref: "#/components/schemas/AnalyticsTopProduct"
          nullable: true
          type: array
      required:
        - overview
        - orders_over_time
        - top_products
      type: object
    AnalyticsOverview:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/AnalyticsOverview.json
          format: uri
          readOnly: true
          type: string
        avg_order_value:
          description: Average order value
          example: 8.34
          format: double
          type: number
        period:
          description: Report period
          example: month
          type: string
        status_breakdown:
          additionalProperties:
            format: int64
            type: integer
          description: Orders grouped by status
          type: object
        total_orders:
          description: Total orders
          example: 150
          format: int64
          type: integer
        total_revenue:
          description: Total revenue
          example: 1250.5
          format: double
          type: number
      required:
        - period
        - total_orders
        - total_revenue
        - avg_order_value
        - status_breakdown
      type: object
    AnalyticsTimelinePoint:
      additionalProperties: false
      properties:
        count:
          description: Order count
          example: 10
          format: int64
          type: integer
        date:
          description: Bucket date
          example: "2026-07-01"
          type: string
        revenue:
          description: Revenue
          example: 100
          format: double
          type: number
      required:
        - date
        - count
        - revenue
      type: object
    AnalyticsTopProduct:
      additionalProperties: false
      properties:
        name:
          description: Product name
          example: Stracciatella
          type: string
        total_sold:
          description: Total units sold
          example: 50
          format: int64
          type: integer
        total_value:
          description: Total sold value
          example: 275
          format: double
          type: number
      required:
        - name
        - total_sold
        - total_value
      type: object
    ArchiveConfig:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/ArchiveConfig.json
          format: uri
          readOnly: true
          type: string
        age_days:
          description: Archive orders older than this many days
          example: 30
          format: int64
          type: integer
        enabled:
          description: Whether auto-archiving is enabled
          example: true
          type: boolean
        interval_minutes:
          description: Archive check interval in minutes
          example: 60
          format: int64
          type: integer
      required:
        - enabled
        - age_days
        - interval_minutes
      type: object
    ArchiveOrderInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/ArchiveOrderInputBody.json
          format: uri
          readOnly: true
          type: string
        archived:
          description: Archive flag
          example: true
          type: boolean
      required:
        - archived
      type: object
    Category:
      additionalProperties: false
