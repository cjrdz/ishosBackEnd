      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update category
      tags:
        - Categories
  /categories/{slug}:
